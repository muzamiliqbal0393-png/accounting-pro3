{% extends 'auth_base.html' %}
{% block title %}Create account{% endblock %}
{% block content %}
<h2>Create your account</h2>
<p class="sub">Each account keeps its own private books.</p>
<form method="post" novalidate>
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label required" for="name">Full name</label>
    <input class="form-control" id="name" name="name" required value="{{ form.get('name','') }}"
           autocomplete="name" placeholder="e.g. Ayesha Khan">
  </div>
  <div class="mb-3">
    <label class="form-label required" for="email">Email address</label>
    <input type="email" class="form-control" id="email" name="email" required
           value="{{ form.get('email','') }}" autocomplete="email" placeholder="you@business.com">
  </div>
  <div class="row g-2">
    <div class="col-sm-6 mb-3">
      <label class="form-label required" for="password">Password</label>
      <input type="password" class="form-control" id="password" name="password" required
             minlength="8" autocomplete="new-password">
      <div class="form-text">Minimum 8 characters.</div>
    </div>
    <div class="col-sm-6 mb-3">
      <label class="form-label required" for="confirm_password">Confirm password</label>
      <input type="password" class="form-control" id="confirm_password"
             name="confirm_password" required minlength="8" autocomplete="new-password">
    </div>
  </div>
  <button class="btn btn-primary w-100" type="submit">Create account</button>
</form>
<hr class="my-4">
<p class="text-center hint mb-0">
  Already registered? <a href="{{ url_for('login') }}">Sign in</a>
</p>
{% endblock %}
