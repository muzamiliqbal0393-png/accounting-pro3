{% extends 'auth_base.html' %}
{% from 'partials/icons.html' import icon %}
{% block title %}Reset password{% endblock %}
{% block auth_heading %}Set a New Password{% endblock %}
{% block content %}
<form method="post">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <div class="ac-field has-toggle">
    <span class="ac-field-ico">{{ icon('lock') }}</span>
    <label class="visually-hidden" for="password">New password</label>
    <input type="password" class="form-control" id="password" name="password" required minlength="8"
           placeholder="New Password (minimum 8 characters)">
    <button class="ac-eye" type="button" data-toggle-password="password" aria-label="Show password">
      {{ icon('eye') }}
    </button>
  </div>
  <div class="ac-field has-toggle">
    <span class="ac-field-ico">{{ icon('shield') }}</span>
    <label class="visually-hidden" for="confirm_password">Confirm new password</label>
    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
           required minlength="8" placeholder="Confirm New Password">
    <button class="ac-eye" type="button" data-toggle-password="confirm_password" aria-label="Show password">
      {{ icon('eye') }}
    </button>
  </div>
  <button class="ac-btn-primary" type="submit">{{ icon('arrow-right') }} Update Password</button>
</form>
<div class="ac-or">OR</div>
<a class="ac-btn-outline" href="{{ url_for('login') }}">{{ icon('lock') }} Back to Sign In</a>
{% endblock %}
