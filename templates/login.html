{% extends 'auth_base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h2>Welcome back</h2>
<p class="sub">Sign in to your accounting workspace.</p>
<form method="post" novalidate>
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label required" for="email">Email address</label>
    <input type="email" class="form-control" id="email" name="email" required autofocus
           value="{{ form.get('email','') }}" autocomplete="email" placeholder="you@business.com">
  </div>
  <div class="mb-3">
    <label class="form-label required" for="password">Password</label>
    <input type="password" class="form-control" id="password" name="password" required
           autocomplete="current-password" placeholder="••••••••">
  </div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="remember" checked>
      <label class="form-check-label hint" for="remember">Keep me signed in</label>
    </div>
    <a class="hint" href="{{ url_for('forgot_password') }}">Forgot password?</a>
  </div>
  <button class="btn btn-primary w-100" type="submit">Sign in</button>
</form>
<hr class="my-4">
<p class="text-center hint mb-0">
  New to ACCOUNTING PRO? <a href="{{ url_for('register') }}">Create an account</a>
</p>
{% endblock %}
